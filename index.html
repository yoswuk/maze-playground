<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="아이를 위한 A4 인쇄용 미로 활동지 생성기" />
    <title>미로 놀이터</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <div class="brand-mark" aria-hidden="true">▦</div>
        <div>
          <p>PRINTABLE MAZE MAKER</p>
          <h1>미로 놀이터</h1>
          <span>아이에게 맞는 난이도로 인쇄용 미로를 만들어요.</span>
        </div>
      </header>

      <div class="app-main">
        <aside class="controls-pane" aria-label="미로 만들기 설정">
          <section class="control-card">
            <div class="control-heading">
              <span>1</span>
              <div>
                <h2>미로 생성</h2>
                <p id="difficulty-description">길이 넓고 갈림길이 적어요</p>
              </div>
            </div>
            <div class="choice-row difficulty-grid" aria-label="난이도 선택">
              <button type="button" class="choice-button" data-difficulty="easy" aria-pressed="true"><span>쉬움</span><small class="difficulty-size">8×8</small></button>
              <button type="button" class="choice-button" data-difficulty="medium" aria-pressed="false"><span>보통</span><small class="difficulty-size">16×16</small></button>
              <button type="button" class="choice-button" data-difficulty="hard" aria-pressed="false"><span>어려움</span><small class="difficulty-size">24×24</small></button>
              <button type="button" class="choice-button expert-choice" data-difficulty="expert" aria-pressed="false"><span>매우 어려움</span><small class="difficulty-size">32×32</small></button>
            </div>
            <div class="new-maze-action">
              <button id="new-maze" type="button" class="new-button"><span aria-hidden="true">↻</span>새 미로 만들기</button>
            </div>
          </section>

          <section class="control-card">
            <div class="control-heading">
              <span>2</span>
              <div>
                <h2>미로 다시 찾기</h2>
                <p>활동지의 미로 번호를 입력하세요</p>
              </div>
            </div>
            <form id="maze-lookup" class="maze-lookup">
              <label for="maze-number">미로 번호</label>
              <div class="lookup-row">
                <input id="maze-number" name="maze-number" type="text" inputmode="numeric" autocomplete="off" maxlength="13" placeholder="1-12345678-90" aria-describedby="lookup-message" />
                <button type="submit">불러오기</button>
              </div>
              <p id="lookup-message" class="lookup-message" aria-live="polite"></p>
            </form>
          </section>

        </aside>

        <section class="preview-pane" aria-label="활동지 미리보기">
          <div class="preview-toolbar">
            <div>
              <p>활동지 미리보기</p>
              <span id="status" aria-live="polite">1개의 미로가 준비됐어요</span>
            </div>
            <button id="toggle-solution" type="button" class="solution-button" aria-pressed="false">정답 보기</button>
          </div>
          <div class="preview-stage">
            <div id="print-area" class="print-area"></div>
          </div>
          <div class="output-panel" aria-label="인쇄와 PDF 저장">
            <div class="output-buttons">
              <button id="print-maze" type="button" class="print-button"><span aria-hidden="true">⌁</span>인쇄하기</button>
              <button id="save-pdf" type="button" class="pdf-button"><span aria-hidden="true">↓</span>PDF 저장</button>
            </div>
            <label class="check-row output-check">
              <input id="print-answers" type="checkbox" checked />
              <span>정답지도 함께 출력</span>
            </label>
            <p class="print-tip">인쇄는 <b>A4·100%</b>를 권장해요. PDF는 현재 기기에서 직접 만들어요.</p>
          </div>
        </section>
      </div>
    </main>

    <script src="./app.js" defer></script>
  </body>
</html>
