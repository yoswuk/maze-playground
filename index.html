<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="아이를 위한 A4 인쇄용 미로 활동지 생성기" />
    <title>미로 놀이터</title>
    <link rel="stylesheet" href="./styles.css?v=20260801-13" />
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <div class="brand-mark" aria-hidden="true">▦</div>
        <div>
          <p>PRINTABLE MAZE MAKER</p>
          <h1>미로 놀이터</h1>
          <span>아이에게 맞는 난이도로 인쇄용 미로를 만들어요.</span>
        </div>
      </header>

      <div class="app-main">
        <section class="preview-pane" aria-label="활동지 미리보기">
          <span id="status" class="sr-only" aria-live="polite">새 미로가 준비됐어요</span>
          <div class="preview-stage">
            <div id="print-area" class="print-area"></div>
          </div>
          <div class="maze-controls" aria-label="미로 설정과 조작">
            <div class="difficulty-slider-control">
              <input id="difficulty-slider" type="range" min="0" max="3" step="1" value="0" aria-label="미로 난이도" aria-valuetext="쉬움 12×12" />
              <div class="difficulty-scale" aria-hidden="true">
                <span data-difficulty-label="easy">쉬움<small>12×12</small></span>
                <span data-difficulty-label="medium">보통<small>18×18</small></span>
                <span data-difficulty-label="hard">어려움<small>24×24</small></span>
                <span data-difficulty-label="expert">매우 어려움<small>30×30</small></span>
              </div>
            </div>
            <div class="maze-actions" aria-label="미로 조작">
              <button id="toggle-solution" type="button" class="solution-button" aria-pressed="false">정답 보기</button>
              <button id="new-maze" type="button" class="new-button"><span aria-hidden="true">↻</span>새 미로 만들기</button>
            </div>
          </div>
          <div class="output-panel" aria-label="미로 인쇄">
            <div class="output-heading">
              <strong>출력</strong>
              <span>입력한 개수만큼 미로를 만들어요.</span>
            </div>
            <div class="output-buttons">
              <button id="print-maze" type="button" class="print-button"><span aria-hidden="true">⌁</span>인쇄하기</button>
            </div>
            <div class="output-options">
              <label class="output-count-control" for="output-count">
                <span>출력할 미로</span>
                <input id="output-count" type="number" inputmode="numeric" min="1" step="1" value="1" />
                <em>개</em>
              </label>
              <label class="check-row output-check">
                <input id="print-answers" type="checkbox" checked />
                <span>정답지 포함</span>
              </label>
            </div>
          </div>
        </section>
      </div>
    </main>

    <script src="./app.js?v=20260801-13" defer></script>
  </body>
</html>
